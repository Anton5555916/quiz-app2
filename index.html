<style>
:root{--bg:#0a0b1e;--card:#14163a;--line:#262a5c;--txt:#eef0ff;--dim:#8d92c9;--c:#00f5ff;--good:#27f59a;--bad:#ff3d71}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 50% -10%,#1d1f58 0%,var(--bg) 60%) fixed;color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:28px;margin:8px 0 4px;text-shadow:0 0 18px #00f5ff88}
h2{font-size:22px;line-height:1.3;margin:10px 0 0}
p.sub{color:var(--dim);margin:0 0 18px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{background:var(--card);border:1px solid var(--c);border-radius:20px;padding:16px 14px;text-align:left;box-shadow:0 0 16px color-mix(in srgb,var(--c) 35%,transparent);transition:transform .15s}
.cat:active{transform:scale(.96)}
.cat .em{font-size:34px}.cat b{display:block;margin:6px 0 2px;font-size:17px}.cat small{color:var(--dim)}
.mini{height:5px;background:#0006;border-radius:9px;margin-top:10px;overflow:hidden}.mini i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.lv{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;font-size:17px}
.lv.open{border-color:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 30%,transparent)}
.lv.lock{opacity:.45;cursor:default}.lv small{color:var(--dim)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ghost{background:#ffffff12;border-radius:12px;padding:8px 14px}
.hearts{font-size:20px;letter-spacing:2px}.cnt{color:var(--dim);min-width:48px;text-align:right}
.bar{height:6px;background:#0006;border-radius:9px;overflow:hidden;margin-bottom:16px}.bar i{display:block;height:100%;background:var(--c);box-shadow:0 0 10px var(--c);transition:width .4s}
.card{background:var(--card);border:1px solid var(--c);border-radius:22px;padding:22px 18px;box-shadow:0 0 22px color-mix(in srgb,var(--c) 30%,transparent);animation:pop .35s ease}
.tag{color:var(--c);font-size:14px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;font-size:17px;transition:transform .12s,background .2s,border-color .2s,box-shadow .2s;animation:pop .35s ease backwards}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
.opt:active{transform:scale(.97)}
.opt.good{background:#0c3d2b;border-color:var(--good);box-shadow:0 0 18px #27f59a77}
.opt.bad{background:#451126;border-color:var(--bad);box-shadow:0 0 18px #ff3d7177}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.res{text-align:center;padding-top:20px}.res .big{font-size:64px;font-weight:800;color:var(--c);text-shadow:0 0 24px var(--c)}
.btn{display:block;width:100%;border-radius:16px;padding:15px;font-size:17px;margin-top:10px;background:var(--card);border:1px solid var(--line)}
.neon{background:linear-gradient(90deg,#00c8ff,#8a5cff);border:0;font-weight:700;box-shadow:0 0 20px #8a5cff77}
.share{border-color:#ff2bd6;box-shadow:0 0 14px #ff2bd655}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.hidden{display:none}
.mbox{background:var(--card);border:1px solid #ff2bd6;border-radius:24px;padding:24px;width:100%;max-width:420px;text-align:center;box-shadow:0 0 30px #ff2bd655;animation:pop .3s}
.mbox .big{font-size:56px}.mbox p{color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

    ["Какая соцсеть сильнее всего влияет на появление новых хитов в последние годы?", "TikTok", "LinkedIn", "Pinterest", "Telegram"],
    ["Кто получил «Грэмми» в категории «Альбом года» 2024 за «Midnights»?", "Тейлор Свифт", "Оливия Родриго", "Билли Айлиш", "SZA"],
    ["В каком британском городе сформировалась группа The Beatles?", "В Ливерпуле", "В Лондоне", "В Манчестере", "В Бирмингеме"]
  ],
  [ // СЮДА ДОБАВИТЬ ВОПРОСЫ ДЛЯ УРОВНЯ 2
    ...STUB ],
  [ // СЮДА ДОБАВИТЬ ВОПРОСЫ ДЛЯ УРОВНЯ 3
    ...STUB ],
  [ // СЮДА ДОБАВИТЬ ВОПРОСЫ ДЛЯ УРОВНЯ 4
    ...STUB ],
  [ // СЮДА ДОБАВИТЬ ВОПРОСЫ ДЛЯ УРОВНЯ 5
    ...STUB ]
]}
];

/* ================== ПРОГРЕСС ================== */
const KEY = "quiz_progress_v1";
let P = {};
try { P = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { P = {}; }
CATS.forEach(c => { P[c.id] = P[c.id] || { unlocked: 1, best: {} }; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

/* ================== УТИЛИТЫ ================== */
const $ = s => document.querySelector(s);
const app = $("#app");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
let S = null; // состояние игры

/* ================== ЭКРАНЫ ================== */
function menu() {
  S = null;
  app.innerHTML = `<h1>Квиз-арена</h1><p class="sub">Выбери категорию</p><div class="grid">` +
    CATS.map((c, i) => `<button class="cat" style="--c:${c.color}" onclick="openCat(${i})">
      <span class="em">${c.emoji}</span><b>${c.name}</b>
      <small>Уровень ${P[c.id].unlocked} из ${LEVELS}</small>
      <div class="mini"><i style="width:${(P[c.id].unlocked - 1) / LEVELS * 100}%"></i></div></button>`).join("") + `</div>`;
}

function openCat(ci) {
  tap();
  const c = CATS[ci], p = P[c.id];
  app.innerHTML = `<div class="top"><button class="ghost" onclick="menu()">← Назад</button></div>
    <h1 style="color:${c.color}">${c.emoji} ${c.name}</h1><p class="sub">Набери ${Math.round(PASS_RATIO * 100)}% и откроешь следующий уровень</p>` +
    c.levels.map((q, i) => {
      const n = i + 1, open = n <= p.unlocked, best = p.best[n];
      return `<button class="lv ${open ? "open" : "lock"}" style="--c:${c.color}" ${open ? `onclick="startLevel(${ci},${n})"` : ""}>
        <span>${open ? "▶" : "🔒"} Уровень ${n}</span><small>${best != null ? "Лучший: " + best + "/" + Math.min(PER_LEVEL, q.length) : open ? "Не пройден" : "Закрыт"}</small></button>`;
    }).join("");
}

function startLevel(ci, lvl) {
  tap();
  const c = CATS[ci];
  const qs = shuffle(c.levels[lvl - 1]).slice(0, PER_LEVEL).map(r => ({
    t: r[0], o: shuffle([{ t: r[1], ok: true }, { t: r[2] }, { t: r[3] }, { t: r[4] }])
  }));
  S = { ci, lvl, qs, i: 0, score: 0, lives: LIVES, lock: false };
  showQ();
}

const hearts = () => "❤️".repeat(S.lives) + "🖤".repeat(LIVES - S.lives);

function showQ() {
  const c = CATS[S.ci], q = S.qs[S.i];
  app.innerHTML = `<div style="--c:${c.color}">
    <div class="top"><button class="ghost" onclick="quit()">✕</button><div class="hearts">${hearts()}</div><div class="cnt">${S.i + 1}/${S.qs.length}</div></div>
    <div class="bar"><i style="width:${S.i / S.qs.length * 100}%"></i></div>
    <div class="card" id="card"><div class="tag">${c.emoji} ${c.name}, уровень ${S.lvl}</div><h2>${q.t}</h2></div>
    <div class="opts">${q.o.map((o, k) => `<button class="opt" onclick="pick(${k})">${o.t}</button>`).join("")}</div></div>`;
}

function pick(k) {
  if (S.lock) return;
  S.lock = true;
  const q = S.qs[S.i], btns = [...document.querySelectorAll(".opt")];
  if (q.o[k].ok) {
    btns[k].classList.add("good"); S.score++; haptic("success");
    setTimeout(next, 750);
  } else {
    btns[k].classList.add("bad");
    btns[q.o.findIndex(o => o.ok)].classList.add("good");
    $("#card").classList.add("shake");
    haptic("error");
    S.lives--;
    $(".hearts").innerHTML = hearts();
    setTimeout(() => (S.lives <= 0 ? noLives() : next()), 1100);
  }
}

function next() {
  S.i++; S.lock = false;
  S.i >= S.qs.length ? finish() : showQ();
}

function quit() { if (confirm("Выйти? Прогресс уровня не сохранится.")) openCat(S.ci); }

/* ================== МОДАЛКИ И РЕКЛАМА ================== */
const openModal = h => { const m = $("#modal"); m.innerHTML = h; m.classList.remove("hidden"); };
const closeModal = () => $("#modal").classList.add("hidden");

function noLives() {
  openModal(`<div class="mbox"><div class="big">💔</div><h2>Жизни закончились</h2><p>Угадано: ${S.score} из ${S.qs.length}</p>
    <button class="btn neon" onclick="watchAd()">📺 Восстановить 1 жизнь за просмотр рекламы</button>
    <button class="btn" onclick="closeModal();finish()">Завершить уровень</button></div>`);
}

function watchAd() {
  let t = AD_SECONDS;
  openModal(`<div class="mbox"><div class="big" id="adt">${t}</div><h2>Реклама</h2><p>Имитация просмотра…</p></div>`);
  // ЗДЕСЬ ВСТАВИТЬ КОД РЕКЛАМНОЙ СЕТИ
  // После успешного просмотра рекламы нужно вызвать adRewarded()
  const iv = setInterval(() => {
    t--;
    const e = $("#adt"); if (e) e.textContent = t;
    if (t <= 0) { clearInterval(iv); adRewarded(); }
  }, 1000);
}

function adRewarded() {
  closeModal(); S.lives = 1; haptic("success"); next();
}

/* ================== ФИНАЛ УРОВНЯ ================== */
function finish() {
  const c = CATS[S.ci], p = P[c.id], total = S.qs.length, need = Math.ceil(total * PASS_RATIO);
  const ok = S.score >= need, last = S.lvl === LEVELS;
  p.best[S.lvl] = Math.max(p.best[S.lvl] || 0, S.score);
  if (ok && !last && p.unlocked <= S.lvl) p.unlocked = S.lvl + 1;
  save();
  S.total = total;
  app.innerHTML = `<div class="res" style="--c:${c.color}">
    <div style="font-size:54px">${ok ? "🏆" : "😅"}</div>
    <h2>${ok ? (last ? "Категория пройдена!" : "Уровень пройден!") : "Не хватило совсем чуть-чуть"}</h2>
    <div class="big">${S.score}/${total}</div>
    <p class="sub">${ok ? (last ? "Ты прошёл все уровни категории" : "Следующий уровень открыт") : "Нужно минимум " + need + " правильных ответов"}</p>
    ${ok && !last ? `<button class="btn neon" onclick="startLevel(${S.ci},${S.lvl + 1})">Следующий уровень</button>` : ""}
    <button class="btn" onclick="startLevel(${S.ci},${S.lvl})">Заново</button>
    <button class="btn share" onclick="challenge()">🔥 Бросить вызов другу</button>
    <button class="btn" onclick="openCat(${S.ci})">К уровням</button></div>`;
  if (ok) { haptic("success"); confetti(); } else haptic("warning");
}

function challenge() {
  const c = CATS[S.ci];
  const text = `Я прошел ${S.lvl} уровень в категории "${c.name}" и набрал ${S.score}/${S.total}! Сможешь повторить?`;
  const url = "https://t.me/share/url?url=" + encodeURIComponent(BOT_LINK) + "&text=" + encodeURIComponent(text);
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, "_blank");
}

/* ================== КОНФЕТТИ ================== */
function confetti() {
  const cv = $("#confetti"), x = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#00f5ff", "#ff2bd6", "#b6ff3b", "#ffd23f", "#8a5cff"];
  const ps = Array.from({ length: 150 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .6, r: 4 + Math.random() * 6,
    c: cols[Math.random() * 5 | 0], vx: -2 + Math.random() * 4, vy: 2 + Math.random() * 4, a: Math.random() * 6, va: -.2 + Math.random() * .4
  }));
  let f = 0;
  (function loop() {
    x.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore();
    });
    if (++f < 220) requestAnimationFrame(loop); else x.clearRect(0, 0, cv.width, cv.height);
  })();
}

menu();
</script>
</body>
</html>
